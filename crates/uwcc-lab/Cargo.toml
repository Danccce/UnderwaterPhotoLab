[package]
name = "uwcc-lab"
description = "UnderwaterPhotoLab: standalone colour correction for underwater photos"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "UnderwaterPhotoLab"
path = "src/main.rs"

[dependencies]
uwcc-core.workspace = true
uwcc-photo.workspace = true
uwcc-filters.workspace = true
slint = { version = "~1.18", features = ["unstable-winit-030"] }
rfd = "0.15"
serde_json = "1"

[build-dependencies]
slint-build = "~1.18"
embed-resource = "3"
