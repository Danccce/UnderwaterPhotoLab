[workspace]
members = [
    "crates/uwcc-core",
    "crates/uwcc-plugin",
    "crates/uwcc-plugin-red",
    "crates/uwcc-photo",
    "crates/uwcc-analyze",
    "crates/uwcc-gui",
    "crates/uwcc-lab",
    "crates/uwcc-plugin-tests",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["Marc Lob", "Nikolaj Bech Andersen (original algorithm)"]
publish = false

[workspace.dependencies]
uwcc-core = { path = "crates/uwcc-core" }
uwcc-photo = { path = "crates/uwcc-photo" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
